name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Yeni versiyon (X.0.0 formatında, v'siz — örn. 23.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (sadece validasyon, push yok)"
        required: false
        type: boolean
        default: false

# Aynı versiyon için paralel çift tetiklemeyi serileştirir.
concurrency:
  group: cut-release-${{ inputs.version }}
  cancel-in-progress: false

# Auth: GitHub App (Contents: R/W, sadece hedef repolara install).
# Her token kullanan job kendi kısa ömürlü App token'ını üretir
# (vars.APP_CLIENT_ID + secrets.APP_PRIVATE_KEY).

jobs:
  # Faz 1: her zaman dry-run validasyon. Job summary'ye ne yapılacağı yazılır
  # (onaylayacak kişi için özet: kaynak SHA'lar + oluşturulacak branch/tag).
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Validate (dry run)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-ios assistbox-android assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: release
          VERSION: ${{ inputs.version }}
          DRY_RUN: "true"
        run: ./scripts/test-cut.sh

      - name: Show approval request
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## 🔔 Onay Gerekli — Cut Release v${{ inputs.version }}"
            echo ""
            echo "3 repoda \`main\` HEAD'inden \`v${{ inputs.version }}\` branch'i + \`v${{ inputs.version }}-RC\` tag'i oluşturulacak."
            echo "Planlanan işlemler yukarıdaki tabloda (kaynak SHA + branch/tag durumu)."
            echo ""
            echo "Devam etmek için **approve-cut** job'ını onaylayın; reddetmek için reject edin."
          } >> "$GITHUB_STEP_SUMMARY"

  # Faz 1.5: her gerçek cut için genel onay kapısı (cut-approval
  # environment'ı). Validate'in job summary'sindeki plan incelenip onaylanır.
  # Dry run'da onay istenmez.
  approve-cut:
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: cut-approval
    steps:
      - name: Approval received
        run: |
          echo "Cut onaylandı: v${{ inputs.version }}"

  # Faz 2: gerçek cut. Dry run'da onay job'ı skip edilir ve doğrudan çalışır;
  # gerçek run'da approve-cut başarıyla geçilmiş olmalı.
  cut:
    needs: [validate, approve-cut]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.approve-cut.result == 'success' || (needs.approve-cut.result == 'skipped' && inputs.dry_run))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Cut release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-ios assistbox-android assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: release
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/test-cut.sh
