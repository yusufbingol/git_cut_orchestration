name: Test Release (Tag FINAL)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FINAL atılacak versiyon (v'siz — örn. 23.0.1). Boş bırakılırsa otomatik: release bekleyen versiyon (RC var, FINAL yok). vX.Y.Z branch HEAD'i tag'lenir; asla main değil."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (sadece validasyon, push yok)"
        required: false
        type: boolean
        default: false

# Aynı versiyon için paralel çift tetiklemeyi serileştirir
# (boş input'ta tüm otomatik run'lar aynı grupta serileşir).
concurrency:
  group: release-final-${{ inputs.version || 'auto' }}
  cancel-in-progress: false

# Auth: GitHub App (Contents: R/W, sadece hedef repolara install).
# Her token kullanan job kendi kısa ömürlü App token'ını üretir
# (vars.APP_CLIENT_ID + secrets.APP_PRIVATE_KEY).

jobs:
  # Faz 1: her zaman dry-run validasyon. Input boşsa versiyonu çözer
  # (otomatik tespit) ve planı job summary'ye yazar (onaylayacak kişi için:
  # branch HEAD SHA'ları + oluşturulacak FINAL tag'i).
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Validate (dry run)
        id: validate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-android assistbox-ios assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: final
          VERSION: ${{ inputs.version }}
          DRY_RUN: "true"
        run: ./scripts/test-cut.sh

      - name: Show approval request
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## 🔔 Onay Gerekli — Release v${{ steps.validate.outputs.version }} (FINAL tag)"
            echo ""
            echo "3 repoda \`v${{ steps.validate.outputs.version }}\` branch HEAD'ine \`v${{ steps.validate.outputs.version }}-FINAL\` tag'i atılacak — bu versiyon production'a çıkmış olarak işaretlenecek."
            echo "Planlanan işlemler yukarıdaki tabloda (branch HEAD SHA + tag durumu)."
            echo ""
            echo "Devam etmek için **approve-release** job'ını onaylayın; reddetmek için reject edin."
          } >> "$GITHUB_STEP_SUMMARY"

  # Faz 1.5: genel onay kapısı (cut-approval environment'ı). Validate'in
  # job summary'sindeki plan incelenip onaylanır. Dry run'da onay istenmez.
  approve-release:
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: cut-approval
    steps:
      - name: Approval received
        run: |
          echo "Release onaylandı: v${{ needs.validate.outputs.version }}"

  # Faz 2: gerçek tag'leme. Dry run'da onay job'ı skip edilir ve doğrudan
  # çalışır; gerçek run'da approve-release başarıyla geçilmiş olmalı.
  tag-final:
    needs: [validate, approve-release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.approve-release.result == 'success' || (needs.approve-release.result == 'skipped' && inputs.dry_run))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Tag FINAL
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-android assistbox-ios assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: final
          # Validasyonda çözümlenen (ve onaylanan) versiyon — tag job'ı asla
          # yeniden tespit yapmaz; onaylanan neyse o tag'lenir.
          VERSION: ${{ needs.validate.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/test-cut.sh

  # Faz 3: changelog — FINAL başarıyla atıldıktan sonra her repo için
  # RC → FINAL aralığındaki commit'leri ve Jira ticket'larını job summary'ye
  # yazar; SLACK_WEBHOOK_URL tanımlıysa Slack'e özet gönderir.
  # Dry run'da çalışmaz (FINAL atılmadı, karşılaştırılacak şey yok).
  changelog:
    needs: [validate, tag-final]
    if: needs.tag-final.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Generate changelog (RC → FINAL)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-android assistbox-ios assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          VERSION: ${{ needs.validate.outputs.version }}
          # Test ortamında Jira ve Slack bağlantısı yok — boş bırakıldığında
          # ticket'lar linksiz listelenir, Slack bildirimi atlanır.
          # Gerçek ortamda: vars.JIRA_BASE_URL + secrets.SLACK_WEBHOOK_URL
          JIRA_BASE_URL: ""
          SLACK_WEBHOOK_URL: ""
        run: ./scripts/test-changelog.sh
