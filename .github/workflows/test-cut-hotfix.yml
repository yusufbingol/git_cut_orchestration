name: Cut Hotfix

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Üzerinden cut alınacak release edilmiş versiyon (v'siz — örn. 22.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (sadece validasyon, push yok)"
        required: false
        type: boolean
        default: false

# Aynı base için paralel çift tetiklemeyi serileştirir.
concurrency:
  group: cut-hotfix-${{ inputs.base_version }}
  cancel-in-progress: false

# Auth: GitHub App (Contents: R/W, sadece hedef repolara install).
# Her token kullanan job kendi kısa ömürlü App token'ını üretir
# (vars.APP_CLIENT_ID + secrets.APP_PRIVATE_KEY).

jobs:
  # Faz 1: her zaman dry-run validasyon. Job summary'ye ne yapılacağı yazılır
  # (onaylayacak kişi için özet). Eski base tespitinde fail etmez
  # (ALLOW_STALE_BASE=true), bunun yerine needs_approval output'u üretir.
  validate:
    runs-on: ubuntu-latest
    outputs:
      needs_approval: ${{ steps.validate.outputs.needs_approval }}
      new_version: ${{ steps.validate.outputs.new_version }}
      approval_message: ${{ steps.validate.outputs.approval_message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Validate (dry run)
        id: validate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-ios assistbox-android assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: hotfix
          BASE_VERSION: ${{ inputs.base_version }}
          DRY_RUN: "true"
          ALLOW_STALE_BASE: "true"
        run: ./scripts/test-cut.sh

      - name: Show approval request (stale base)
        if: steps.validate.outputs.needs_approval == 'true'
        run: |
          {
            echo "## ⚠️ Onay Gerekli — Eski Base'den Hotfix"
            echo ""
            echo "> ${{ steps.validate.outputs.approval_message }}"
            echo ""
            echo "Devam etmek için **approve-stale-base** job'ını onaylayın; reddetmek için reject edin."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show approval request (cut)
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## 🔔 Onay Gerekli — Cut Hotfix v${{ steps.validate.outputs.new_version }}"
            echo ""
            echo "3 repoda \`v${{ inputs.base_version }}\` HEAD'inden \`v${{ steps.validate.outputs.new_version }}\` branch'i + \`v${{ steps.validate.outputs.new_version }}-RC\` tag'i oluşturulacak."
            echo "Planlanan işlemler yukarıdaki tabloda (kaynak SHA + branch/tag durumu)."
            echo ""
            echo "Devam etmek için **approve-cut** job'ını onaylayın; reddetmek için reject edin."
          } >> "$GITHUB_STEP_SUMMARY"

  # Faz 1.5a: sadece eski base tespit edilirse çalışır — hotfix-approval
  # environment'ının required reviewer'ı (ikinci göz, prevent self-review
  # önerilir) onay verene kadar bekler.
  approve-stale-base:
    needs: validate
    if: needs.validate.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    environment: hotfix-approval
    steps:
      - name: Approval received
        run: |
          echo "Onay alındı: ${{ needs.validate.outputs.approval_message }}"

  # Faz 1.5b: her gerçek cut için genel onay kapısı (cut-approval
  # environment'ı). Validate'in job summary'sindeki plan incelenip onaylanır.
  # Dry run'da onay istenmez. Eski base'de önce approve-stale-base geçilmiş
  # olmalı.
  approve-cut:
    needs: [validate, approve-stale-base]
    if: >-
      always() && !inputs.dry_run &&
      needs.validate.result == 'success' &&
      (needs.approve-stale-base.result == 'success' || needs.approve-stale-base.result == 'skipped')
    runs-on: ubuntu-latest
    environment: cut-approval
    steps:
      - name: Approval received
        run: |
          echo "Cut onaylandı: v${{ needs.validate.outputs.new_version }} (base: v${{ inputs.base_version }})"

  # Faz 2: gerçek cut. Dry run'da onay job'ları skip edilir ve doğrudan
  # çalışır; gerçek run'da approve-cut (ve eski base'de approve-stale-base)
  # başarıyla geçilmiş olmalı.
  cut:
    needs: [validate, approve-stale-base, approve-cut]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.approve-stale-base.result == 'success' || needs.approve-stale-base.result == 'skipped') &&
      (needs.approve-cut.result == 'success' || (needs.approve-cut.result == 'skipped' && inputs.dry_run))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yusufbingol
          repositories: |
            git_deneme
            git_deneme_2
            git_deneme_3

      - name: Cut hotfix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: yusufbingol
          # Gerçek ortamda: assistbox-ios assistbox-android assistbox-mobile-web-content
          REPOS: git_deneme git_deneme_2 git_deneme_3
          MODE: hotfix
          BASE_VERSION: ${{ inputs.base_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Eski base ise buraya sadece approval'dan geçilerek ulaşılır.
          ALLOW_STALE_BASE: ${{ needs.validate.outputs.needs_approval }}
        run: ./scripts/test-cut.sh
