name: Cut Hotfix

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Released version to cut from (without 'v' — e.g. 22.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (validation only, no pushes)"
        required: false
        type: boolean
        default: false

# Serializes parallel duplicate triggers for the same base.
concurrency:
  group: cut-hotfix-${{ inputs.base_version }}
  cancel-in-progress: false

# Auth: GitHub App (Contents: R/W, installed only on the target repos).
# Each token-using job creates its own short-lived App token
# (vars.APP_CLIENT_ID + secrets.APP_PRIVATE_KEY).

jobs:
  # Phase 1: always a dry-run validation. The plan is written to the job
  # summary (for the approver). Does not fail on stale-base detection
  # (ALLOW_STALE_BASE=true); it produces the needs_approval output instead.
  validate:
    runs-on: ubuntu-latest
    outputs:
      needs_approval: ${{ steps.validate.outputs.needs_approval }}
      new_version: ${{ steps.validate.outputs.new_version }}
      approval_message: ${{ steps.validate.outputs.approval_message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: assistbox
          repositories: |
            assistbox-android
            assistbox-ios
            assistbox-mobile-web-content

      - name: Validate (dry run)
        id: validate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: assistbox
          REPOS: assistbox-android assistbox-ios assistbox-mobile-web-content
          MODE: hotfix
          BASE_VERSION: ${{ inputs.base_version }}
          DRY_RUN: "true"
          ALLOW_STALE_BASE: "true"
        run: ./scripts/cut.sh

      - name: Show approval request (stale base)
        if: steps.validate.outputs.needs_approval == 'true'
        run: |
          {
            echo "## ⚠️ Approval Required — Hotfix from a Stale Base"
            echo ""
            echo "> ${{ steps.validate.outputs.approval_message }}"
            echo ""
            echo "Approve the **approve-stale-base** job to continue; reject it to stop."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show approval request (cut)
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## 🔔 Approval Required — Cut Hotfix v${{ steps.validate.outputs.new_version }}"
            echo ""
            echo "Branch \`v${{ steps.validate.outputs.new_version }}\` + tag \`v${{ steps.validate.outputs.new_version }}-RC\` will be created from \`v${{ inputs.base_version }}\` HEAD in 3 repos."
            echo "The planned operations are in the table above (source SHA + branch/tag status)."
            echo ""
            echo "Approve the **approve-cut** job to continue; reject it to stop."
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 1.5a: runs only when a stale base is detected — waits until a
  # required reviewer of the hotfix-approval environment approves.
  approve-stale-base:
    needs: validate
    if: needs.validate.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    environment: hotfix-approval
    steps:
      - name: Approval received
        run: |
          echo "Approval received: ${{ needs.validate.outputs.approval_message }}"

  # Phase 1.5b: general approval gate for every real cut (cut-approval
  # environment). The plan in validate's job summary is reviewed and
  # approved. No approval is requested for dry runs. On a stale base,
  # approve-stale-base must have passed first.
  approve-cut:
    needs: [validate, approve-stale-base]
    if: >-
      always() && !inputs.dry_run &&
      needs.validate.result == 'success' &&
      (needs.approve-stale-base.result == 'success' || needs.approve-stale-base.result == 'skipped')
    runs-on: ubuntu-latest
    environment: cut-approval
    steps:
      - name: Approval received
        run: |
          echo "Cut approved: v${{ needs.validate.outputs.new_version }} (base: v${{ inputs.base_version }})"

  # Phase 2: the real cut. On dry runs the approval jobs are skipped and this
  # runs directly; on real runs approve-cut (and, on a stale base,
  # approve-stale-base) must have succeeded.
  cut:
    needs: [validate, approve-stale-base, approve-cut]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.approve-stale-base.result == 'success' || needs.approve-stale-base.result == 'skipped') &&
      (needs.approve-cut.result == 'success' || (needs.approve-cut.result == 'skipped' && inputs.dry_run))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: assistbox
          repositories: |
            assistbox-android
            assistbox-ios
            assistbox-mobile-web-content

      - name: Cut hotfix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: assistbox
          REPOS: assistbox-android assistbox-ios assistbox-mobile-web-content
          MODE: hotfix
          BASE_VERSION: ${{ inputs.base_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # On a stale base this point is only reachable via the approval.
          ALLOW_STALE_BASE: ${{ needs.validate.outputs.needs_approval }}
        run: ./scripts/cut.sh
